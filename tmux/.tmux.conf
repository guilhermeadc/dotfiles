unbind r
bind r source-file ~/.tmux.conf

set-option -g mouse on
set-option -g focus-events off

# Configuração de comando de reload do arquivo de configuração
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Configuração de índice de windows
set -g base-index 1
set -g pane-base-index 1
set-window-option -g  pane-base-index 1
set-option -g renumber-windows on

unbind -n MouseDown3Pane
unbind -n MouseUp3Pane

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.1'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha" # latte, frappe, macchiato, or mocha
set -g @catppuccin_window_status_style "rounded" # basic, rounded, slanted, custom, or none

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
#set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
#set -agF status-right "#{E:@catppuccin_status_battery}"

# Exibir o nome da janela em vez do diretório
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# Instalar plugins ausentes automaticamente
if-shell 'test -x "$HOME/.tmux/plugins/tpm/bin/install_plugins"' \
    'run-shell -b "$HOME/.tmux/plugins/tpm/bin/install_plugins"'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
