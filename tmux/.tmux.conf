# =============================================================================
# Geral
# =============================================================================
set-option -g mouse on
set-option -g focus-events off

unbind -n MouseDown3Pane
unbind -n MouseUp3Pane

# Configuração de índice de window e panel
set -g base-index 1
set -g pane-base-index 1
set-window-option -g  pane-base-index 1
set-option -g renumber-windows on

# =============================================================================
# Atalhos
# =============================================================================
# Reload das configurações de Tmux
unbind r
bind r source-file ~/.tmux.conf

# Alterna para a última janela selecionada (sobrescreve binding antigo que persiste no servidor)
bind l last-window

# Abre novas janelas considerando o diretório local
# bind C new-window -c "#{pane_current_path}"

# =============================================================================
# Modo vi e cópia
# =============================================================================
# Ativa o modo vi para navegação e seleção
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# =============================================================================
# Plugins
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'

# =============================================================================
# Tema catppuccin
# =============================================================================
set -g @catppuccin_flavor "mocha" # latte, frappe, macchiato, or mocha
set -g @catppuccin_window_status_style "rounded" # basic, rounded, slanted, custom, or none
set -g @catppuccin_status_right_separator "#[fg=#{@thm_mantle}]#[none]"
set -g @catppuccin_status_session_text_bg "#729a70"
set -g @catppuccin_status_session_text_fg "#{@thm_base}"
set -g @catppuccin_session_text " #S  "

# Tamanho máximo dos lados da barra de status
set -g status-right-length 100
set -g status-left-length 100

# Ativar ícones de status
set -g @catppuccin_window_status_icon "off"
set -g @catppuccin_window_zoom_icon "on"
set -g @catppuccin_icon_zoom ""

# Exibir o nome da janela em vez do diretório + o indicador de zoom
set -g @catppuccin_window_text ' #W #F'
set -g @catppuccin_window_current_text ' #W #F'

# Textos dos indicadores da direita (espaço extra após o valor)
# Descarta valor antigo da opção que persiste no servidor entre recarregamentos
set -ug @catppuccin_uptime_text
set -g @catppuccin_application_text " #{pane_current_command} "
set -g @catppuccin_cpu_text " #{l:#{cpu_percentage}} "

# =============================================================================
# tmux-cpu
# =============================================================================
# Cores literais (mocha): o script do tmux-cpu não expande #{@thm_*}
set -g @cpu_low_fg_color "#cdd6f4"
set -g @cpu_medium_fg_color "#cdd6f4"
set -g @cpu_high_fg_color "#11111b"
set -g @cpu_low_bg_color "#313244"
set -g @cpu_medium_bg_color "#313244"
set -g @cpu_high_bg_color "#f38ba8"

# =============================================================================
# Inicialização do tpm
# =============================================================================
# Instalar plugins ausentes automaticamente
if-shell 'test -x "$HOME/.tmux/plugins/tpm/bin/install_plugins"' \
    'run-shell -b "$HOME/.tmux/plugins/tpm/bin/install_plugins"'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# =============================================================================
# Barra de status (deve ficar após o tpm)
# =============================================================================
# Módulos da direita: lado direito reto e borda esquerda arredondada.
# Recriados após o tpm; o módulo de sessão é recriado em seguida com a borda côncava.
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"
source -F "~/.tmux/plugins/tmux/status/application.conf"
source -F "~/.tmux/plugins/tmux/status/cpu.conf"
source -F "~/.tmux/plugins/tmux/status/ram.conf"
source -F "~/.tmux/plugins/tmux/status/uptime.conf"
set -gF @catppuccin_uptime_text "#{@catppuccin_uptime_text} "

# Módulo de sessão: marcador em verde no canto esquerdo da janela
set -g @catppuccin_status_left_separator "#[fg=#{@thm_green},bg=#{@thm_green}] #[none]"
set -g @catppuccin_status_right_separator "#[fg=#{@thm_mantle}]#[none]"
set -g @catppuccin_status_connect_separator "yes"
source -F "~/.tmux/plugins/tmux/status/session.conf"

# Composição dos lados esquerdo e direito
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right " "
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right " "
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right " "
set -ag status-right "#{E:@catppuccin_status_uptime}"

# O tmux-cpu precisa rodar depois de montar o status-right para interpolar #{cpu_*}
run '~/.tmux/plugins/tmux-cpu/cpu.tmux'
